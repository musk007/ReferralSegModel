# ============================================================================
# biomed_seg_lang_v1_histopath_nolora.yaml
# ============================================================================
# Stacked on top of biomed_seg_lang_v1_histopath_full.yaml.
# Trains lang_encoder + predictor only (no LoRA — full weight fine-tuning).
# backbone and pixel_decoder are frozen via FIX_PARAM.
# ============================================================================

# Disable LoRA — lang_encoder and predictor are trained at full precision.
SOLVER.LORA:
  ENABLED: false

# Freeze backbone and pixel_decoder; lang_encoder + predictor remain trainable.
SOLVER.FIX_PARAM:
  backbone: false
  lang_encoder: false
  pixel_decoder: false
  predictor: false

# LR multipliers per component.
# lang_encoder gets the full BASE_LR; predictor half; frozen heads get 0.
SOLVER.LR_MULTIPLIER:
  backbone: 1.0
  pixel_decoder: 1.0
  predictor: 1.0
  lang_encoder: 1.0

# ---------------------------------------------------------------------------
# Warmup schedule
#
# The model starts from BASE_LR × WARMUP_FACTOR = 1e-5 × 1e-3 = 1e-8,
# then linearly ramps up to BASE_LR over WARMUP_ITERS iterations.
# After warmup the WarmupMultiStepLR scheduler continues normally.
#
# Tune WARMUP_ITERS (100–500) via --overrides in the runner script.
# ---------------------------------------------------------------------------
SOLVER.WARMUP_FACTOR: 1     # start LR = BASE_LR × 0.001  (= 1e-8 when BASE_LR=1e-5)
SOLVER.WARMUP_ITERS: 0         # ramp-up length (overridable)
SOLVER.WARMUP_METHOD: "linear"   # linear ramp from 1e-8 → BASE_LR
