# ============================================================================
# biomed_seg_lang_v1_histopath_full.yaml
# ============================================================================
# Histopathology fine-tuning with selective trainable layers.
# Only query_feat + query_embed are trainable.
#
# Compared to the text-encoder-only config:
#   - FIX_PARAM is empty  → nothing is frozen
#   - BASE_LR is lower    → prevents catastrophic forgetting of pretrained weights
#   - LR_MULTIPLIER gives differential learning rates per component:
#       backbone      → 10 % of BASE_LR  (most conservative — deep visual features)
#       pixel_decoder → 20 % of BASE_LR
#       predictor     → 50 % of BASE_LR  (transformer decoder / cross-attention heads)
#       lang_encoder  → 100% of BASE_LR  (text encoder adapts most to new domain)
#
# Loaded second via --conf_files; patches only the keys listed below.
# ============================================================================

# ----------------------------------------------------------------------------
# Dataset configuration
# ----------------------------------------------------------------------------
# # Default: BiomedParse official + your histopath (colon, lung, prostate, breast_*)
# DATASETS.TRAIN:
#   - "biomed_CombinedFull_train"

# DATASETS.TEST:
#   - "biomed_CombinedFull_test"

# ---- Alternatives (uncomment to use) ---------------------------------------
# Histopath only (your data):
DATASETS.TRAIN: ["biomed_HistoPathAll_train"]
DATASETS.EVAL:  ["biomed_HistoPathAll_eval"]   # held-out split for best-model tracking
DATASETS.TEST:  ["biomed_HistoPathAll_test"]
# BiomedParse official only:
# DATASETS.TRAIN: ["biomed_BiomedParseAll_train"]
# DATASETS.TEST:  ["biomed_BiomedParseAll_test"]
# Individual datasets (uncomment instead of CombinedFull) ---------------
# DATASETS.TRAIN:
#   - "biomed_HistoPathColon_train"
#   - "biomed_HistoPathBCSS_train"
#   - "biomed_HistoPathCells_train"
#   - "biomed_HistoPathLung_train"
#   - "biomed_HistoPathProstate_train"
# DATASETS.TEST:
#   - "biomed_HistoPathColon_test"
#   - "biomed_HistoPathBCSS_test"
#   - "biomed_HistoPathCells_test"
#   - "biomed_HistoPathLung_test"
#   - "biomed_HistoPathProstate_test"
DATASETS.PROMPT_COMBINE: true

# Disable geometric/color augmentation in dataset mapper.
# With augment=false, mapper uses read_rgb() path: pad-to-square + resize only.
INPUT.AUGMENT: false
# ----------------------------------------------------------------------------
# Training settings
# ----------------------------------------------------------------------------

SOLVER.LORA:
  ENABLED: False
  # R: 8                    # LoRA rank
  # ALPHA: 16               # LoRA alpha (scaling)
  # TARGET_MODULES: ["sem_seg_head", "lang_encoder", "predictor"]  # or more specific: query, key, value, c_proj
  # DROPOUT: 0.0


SOLVER.BEST_METRIC: "mIoU"         # metric used to select and save the best checkpoint

SOLVER.BASE_LR: 0.00001         # 5x lower than text-only run to protect visual features
SOLVER.MAX_NUM_EPOCHS: 100
SOLVER.WARMUP_ITERS: 0        # longer warmup: more params need to settle
SOLVER.STEPS: []             # no LR decay

# Explicit allowlist: freeze everything, train only matching params.
# `query_feat` and `query_embed` are decoder query embeddings (101, 512).
SOLVER.TRAINABLE_PARAMS:
  - query_feat
  - query_embed
  - class_embed
  - lang_proj
  - sem_seg_head

# Fallback freeze controls (used only when TRAINABLE_PARAMS is empty).
SOLVER.FIX_PARAM: 
  backbone: true
  lang_encoder: true
  pixel_decoder: true
  predictor: true
SOLVER.IGNORE_FIX: []

# Differential learning rates per component.
# Any param whose name contains the key gets BASE_LR * multiplier.
# Params not matching any key receive BASE_LR (1.0x) by default.
SOLVER.LR_MULTIPLIER:
  backbone: 1.0         # visual backbone  → 1e-6  (most conservative)
  pixel_decoder: 1.0    # pixel / FPN decoder → 2e-6
  predictor: 1.0       # transformer decoder → 5e-6
  lang_encoder: 1.0     # text encoder        → 1e-5 (most aggressive)

# Load the pretrained BiomedParse v1 checkpoint before fine-tuning.
WEIGHT: true
RESUME_FROM: "hf_hub:microsoft/BiomedParse"
