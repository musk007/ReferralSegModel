# ============================================================================
# biomed_seg_lang_v1_histopath_nolora.yaml
# ============================================================================
# Stacked on top of biomed_seg_lang_v1_histopath_full.yaml.
# Uses full-weight updates (no LoRA).
# Explicitly train ONLY classification head + mask head + text projection.
# ============================================================================

# Disable LoRA — lang_encoder and predictor are trained at full precision.
SOLVER.LORA:
  ENABLED: false

# Disable geometric/color augmentation in dataset mapper.
# Keeps preprocessing to resize pipeline (with normalization in model preprocessing).
INPUT.AUGMENT: false

# Freeze all params first, then unfreeze only matching names.
SOLVER.TRAINABLE_PARAMS:
  - sem_seg_head
  - query_feat
  - query_embed

# Fallback freeze controls (only used if TRAINABLE_PARAMS is removed/empty).
SOLVER.FIX_PARAM:
  backbone: true
  lang_encoder: true
  pixel_decoder: true
  predictor: true

# LR multipliers per component (kept at 1.0; only TRAINABLE_PARAMS get optimized).
SOLVER.LR_MULTIPLIER:
  backbone: 1.0
  lang_encoder: 1.0
  pixel_decoder: 1.0
  predictor: 1.0

# ---------------------------------------------------------------------------
# Warmup schedule
#
# Default here is effectively no warmup:
#   WARMUP_FACTOR=1 and WARMUP_ITERS=0 -> starts at BASE_LR immediately.
# Override from the runner if you want warmup, e.g.:
#   WARMUP_FACTOR=0.001, WARMUP_ITERS=100
#
# Tune WARMUP_ITERS (100–500) via --overrides in the runner script.
# ---------------------------------------------------------------------------
SOLVER.WARMUP_FACTOR: 1
SOLVER.WARMUP_ITERS: 0         # ramp-up length (overridable)
SOLVER.WARMUP_METHOD: "linear"
SOLVER.STEPS: []               # no LR decay
